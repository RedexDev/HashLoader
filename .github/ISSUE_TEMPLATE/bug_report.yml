name: Bug report
description: Report a reproducible problem with HashLoader
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Remove personal or sensitive information from logs and screenshots.

  - type: input
    id: version
    attributes:
      label: HashLoader version or commit
      placeholder: e.g. v1.0.0
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: e.g. Windows 11 x86_64
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain what happened and what you expected.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Include relevant details; redact sensitive data.
      render: text
